name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cscn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cscn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_ADAPTER: pg
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cscn_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/cscn_test?schema=public
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000
      AUTH_SECRET: ci-only-not-a-production-secret-32-characters
      NEXT_PUBLIC_SUPABASE_URL: https://local-preview-disabled.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: local-preview-disabled

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate:deploy
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint:baseline
      - run: pnpm build
